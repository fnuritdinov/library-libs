syntax = "proto3";

package core;

option go_package = "/corepb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service CoreService {
  rpc CreateAuthor(CreateAuthorRequest) returns (Author);
  rpc GetAuthor(GetAuthorRequest) returns (Author);
  rpc GetAuthors(GetAuthorsRequest) returns (GetAuthorsResponse);
  rpc UpdateAuthor(UpdateAuthorRequest) returns (Author);
  rpc DeleteAuthor(DeleteAuthorRequest) returns (google.protobuf.Empty);

  // Нужен gateway: получить сразу несколько авторов по их id,
  // чтобы подставить имена в список книг одним запросом.
  rpc GetAuthorsByIDs(GetAuthorsByIDsRequest) returns (GetAuthorsByIDsResponse);


  rpc CreateCategory(CreateCategoryRequest) returns (Category);
  rpc GetCategory(GetCategoryRequest) returns (Category);
  rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (Category);
  rpc DeleteCategory(DeleteCategoryRequest) returns (google.protobuf.Empty);
}

message Author {
  int64 id = 1;
  string full_name = 2;
  string biography = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  optional google.protobuf.Timestamp deleted_at = 6;
}

message Category {
  int64 id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  optional google.protobuf.Timestamp deleted_at = 5;
}


message PageRequest {
  int32 limit = 1;   // 0 => 20 по умолчанию, максимум 100
  int32 offset = 2;
}

message PageInfo {
  int64 total = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message CreateAuthorRequest {
  string full_name = 1;
  string biography = 2;
}

message GetAuthorRequest {
  int64 author_id = 1;
}

message GetAuthorsRequest {
  PageRequest page = 1;
  string query = 2;
}

message GetAuthorsResponse {
  repeated Author authors = 1;
  PageInfo page_info = 2;
}

message GetAuthorsByIDsRequest {
  repeated int64 author_ids = 1;
}

message GetAuthorsByIDsResponse {
  map<int64, Author> authors = 1;
}

message UpdateAuthorRequest {
  int64 author_id = 1;
  optional string full_name = 2;
  optional string biography = 3;
}

message DeleteAuthorRequest {
  int64 author_id = 1;
}



message CreateCategoryRequest {
  string name = 1;
}

message GetCategoryRequest {
  int64 category_id = 1;
}

message GetCategoriesRequest {
  PageRequest page = 1;
  string query = 2;
}

message GetCategoriesResponse {
  repeated Category categories = 1;
  PageInfo page_info = 2;
}

message UpdateCategoryRequest {
  int64 category_id = 1;
  string name = 2;
}

message DeleteCategoryRequest {
  int64 category_id = 1;
}
